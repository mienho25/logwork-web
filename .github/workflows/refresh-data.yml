name: Refresh logwork data

# Re-fetch worklogs from both Jira sites every 15 min (or manually from
# the Actions tab) and commit data.json. Vercel redeploys automatically
# on each push, so the static site always shows fresh numbers.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch worklog data from both Jira sites
        env:
          JIRA_ENOTION_URL: ${{ secrets.JIRA_ENOTION_URL }}
          JIRA_ENOTION_EMAIL: ${{ secrets.JIRA_ENOTION_EMAIL }}
          JIRA_ENOTION_TOKEN: ${{ secrets.JIRA_ENOTION_TOKEN }}
          JIRA_VORTECH_URL: ${{ secrets.JIRA_VORTECH_URL }}
          JIRA_VORTECH_EMAIL: ${{ secrets.JIRA_VORTECH_EMAIL }}
          JIRA_VORTECH_TOKEN: ${{ secrets.JIRA_VORTECH_TOKEN }}
        run: python logwork.py --json

      - name: Commit data.json
        run: |
          git config user.name "logwork-bot"
          git config user.email "logwork-bot@users.noreply.github.com"
          git add data.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh logwork $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "No changes, nothing to commit."
          fi